<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>وُدِّي · Wuddi</title>
    <script>
      (function () {
        // Short share links: /p/{token} → branded Surge host
        var path = location.pathname || "";
        var parts = path.split("/").filter(Boolean);
        var i = parts.indexOf("p");
        if (i >= 0 && parts[i + 1] && parts[i + 1] !== "index.html") {
          var token = parts[i + 1];
          location.replace("https://wuddi.surge.sh/p/" + encodeURIComponent(token));
          return;
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Nunito:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cream: #fff8f3;
        --blush: #f6e7e2;
        --rose: #b75d69;
        --deep: #6e2c3a;
        --ink: #2c1b1f;
        --muted: #8a6e73;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, var(--cream), var(--blush) 40%, var(--cream));
        color: var(--ink);
        font-family: Amiri, serif;
        text-align: center;
        padding: 24px;
      }
      h1 { color: var(--deep); font-size: 48px; margin: 0; }
      .latin {
        font-family: Nunito, sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--rose);
        font-size: 13px;
        font-weight: 700;
      }
      a { color: var(--rose); font-weight: 700; text-decoration: none; margin: 0 8px; }
    </style>
  </head>
  <body>
    <div>
      <h1>وُدِّي</h1>
      <p class="latin">Wuddi</p>
      <p>الصفحة غير موجودة</p>
      <p>
        <a href="/privacy/">الخصوصية</a>
        <a href="/support/">الدعم</a>
      </p>
    </div>
  </body>
</html>
