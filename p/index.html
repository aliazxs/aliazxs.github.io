<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>وُدِّي · مشاركة</title>
    <meta http-equiv="refresh" content="0;url=https://wuddi.surge.sh/p/" />
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var token = (params.get("t") || params.get("token") || "").trim();
        if (!token && location.hash && location.hash.length > 1) {
          token = location.hash.slice(1).trim();
        }
        var parts = location.pathname.split("/").filter(Boolean);
        var i = parts.lastIndexOf("p");
        if (!token && i >= 0 && parts[i + 1] && parts[i + 1] !== "index.html") {
          token = parts[i + 1];
        }
        var dest = "https://wuddi.surge.sh/p/" + encodeURIComponent(token);
        if (!token) dest = "https://wuddi.surge.sh/";
        location.replace(dest);
      })();
    </script>
  </head>
  <body>
    <p>جاري التحويل إلى <a href="https://wuddi.surge.sh/">wuddi.surge.sh</a>…</p>
  </body>
</html>
